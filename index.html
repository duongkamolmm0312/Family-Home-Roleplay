*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Mitr","Noto Sans Thai","Arial Rounded MT Bold",Arial,sans-serif;font-weight:700;color:var(--ink);background:linear-gradient(145deg,#b8ecff 0%,#ffe2f2 48%,#fff0b4 100%);touch-action:none;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}.hidden{display:none!important}

.logo{font-weight:900;font-size:clamp(2.15rem,6vw,5rem);line-height:.98;text-align:center;color:#fff;letter-spacing:-.04em;text-shadow:0 3px 0 var(--a),0 7px 0 color-mix(in srgb,var(--b) 70%,#59318c),0 12px 22px rgba(49,30,90,.28);margin:6px 0}.ribbon{margin:10px auto 18px;width:max-content;max-width:95%;padding:8px 22px;border-radius:999px;background:linear-gradient(180deg,#fff7a9,#ffcf52);border:3px solid #fff;box-shadow:0 0 0 3px #f3a63b,0 8px 14px rgba(104,61,23,.18);font-size:clamp(.95rem,2vw,1.35rem);font-weight:900;text-align:center}.title{font-size:clamp(1.65rem,4vw,3rem);font-weight:900;text-align:center;margin:4px 0 16px;color:var(--ink);text-shadow:0 2px #fff}.subtitle{text-align:center;font-size:clamp(1rem,2vw,1.35rem);font-weight:700;margin:-8px 0 14px}.cover-grid{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(340px,1.5fr) minmax(190px,.8fr);gap:16px;align-items:stretch}.panel{background:linear-gradient(145deg,#fff,#fff7fd);border:4px solid #fff;border-radius:26px;box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 58%,white),0 9px 20px rgba(62,39,111,.18),inset 0 -8px 18px rgba(150,100,210,.08);padding:14px}.panel h3{margin:0 0 10px;text-align:center;font-weight:900;font-size:clamp(1.05rem,2vw,1.45rem);color:var(--a)}.mini-list{display:grid;gap:9px}.mini-pill{border-radius:16px;padding:9px 10px;background:linear-gradient(180deg,#fff,#eef7ff);border:3px solid #fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--b) 40%,white),0 5px 9px rgba(48,39,90,.12);font-weight:800;font-size:clamp(.85rem,1.7vw,1.05rem)}

.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}.btn{position:relative;border:4px solid #fff;border-radius:20px;padding:11px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--a) 55%,white),var(--a));color:#fff;font-weight:900;font-size:clamp(1rem,2vw,1.35rem);text-shadow:0 2px 0 rgba(71,35,99,.35);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 78%,#6e3f93),0 8px 0 color-mix(in srgb,var(--a) 62%,#5b347d),0 13px 18px rgba(57,37,95,.22);cursor:pointer;transition:.16s transform,.16s filter;min-height:52px}.btn:hover,.btn:focus-visible{transform:translateY(-4px);filter:brightness(1.08);outline:4px solid #fff96e;outline-offset:3px}.btn:active{transform:translateY(5px);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 78%,#6e3f93),0 3px 0 color-mix(in srgb,var(--a) 62%,#5b347d)}.btn.alt{background:linear-gradient(180deg,color-mix(in srgb,var(--b) 45%,white),var(--b));box-shadow:0 0 0 3px color-mix(in srgb,var(--b) 75%,#4c3b81),0 8px 0 color-mix(in srgb,var(--b) 58%,#43346f),0 13px 18px rgba(57,37,95,.22)}.btn.gold{background:linear-gradient(180deg,#fff394,#ffad31);box-shadow:0 0 0 3px #ef812a,0 9px 0 #c86322,0 14px 20px rgba(87,54,27,.25);color:#fff}.btn.ghost{background:linear-gradient(#fff,#edf7ff);color:var(--ink);text-shadow:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--b) 45%,white),0 7px 0 #bfd5ea}.btn.start{font-size:clamp(1.45rem,3vw,2.2rem);padding:15px 42px;border-radius:26px;animation:pulse 1.7s ease-in-out infinite}@keyframes pulse{50%{filter:brightness(1.12) drop-shadow(0 0 13px #fff56e);transform:scale(1.035)}}.btn.small{font-size:.95rem;min-height:42px;padding:7px 12px;border-width:3px;border-radius:15px;box-shadow:0 0 0 2px color-mix(in srgb,var(--a) 78%,#6e3f93),0 5px 0 color-mix(in srgb,var(--a) 62%,#5b347d)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.choice-card{background:linear-gradient(145deg,#fff,#f8f0ff);border:4px solid #fff;border-radius:24px;box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 42%,white),0 10px 18px rgba(50,40,95,.16);padding:18px;text-align:center;cursor:pointer;transition:.18s;min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:center}.choice-card:hover,.choice-card.selected{transform:translateY(-7px) scale(1.02);box-shadow:0 0 0 5px #fff86b,0 13px 24px rgba(50,40,95,.22)}.choice-card .big{font-size:3.5rem}.choice-card b{font-size:clamp(1.15rem,2.2vw,1.55rem);font-weight:900}.choice-card p{margin:6px 0 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{background:#fff;border:3px solid #e7d8ff;border-radius:18px;padding:12px;display:grid;gap:7px}.field label{font-weight:900}.field input,.field select,.field textarea{width:100%;border:3px solid #d9c8f7;border-radius:13px;padding:9px;background:#fff;color:var(--ink);font-weight:700}.field input[type=checkbox]{width:24px;height:24px}.scrollbox{max-height:47vh;overflow:auto;border-radius:18px;border:3px solid #d8c9f6;background:#fff;padding:8px}.teacher-table{width:100%;border-collapse:separate;border-spacing:0 8px}.teacher-table td,.teacher-table th{padding:6px}.teacher-table tr{background:#f8f1ff}.teacher-table input{width:100%;min-width:90px;border:2px solid #d9c8f7;border-radius:10px;padding:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}.tab{border:3px solid #fff;border-radius:999px;padding:7px 14px;background:#e9dcff;cursor:pointer;font-weight:900}.tab.active{background:var(--a);color:white;box-shadow:0 0 0 3px var(--b)}
#playShell{position:absolute;inset:0;padding:var(--safeT) 8px var(--safeB);background:#18203a;overflow:hidden}.camera-stage{position:relative;width:100%;height:100%;overflow:hidden;border-radius:24px;background:radial-gradient(circle at center,#33416b,#11172c);border:4px solid #fff;box-shadow:inset 0 0 0 4px var(--a)}#cameraVideo,#handCanvas,#fxCanvas,#gameLayer{position:absolute;inset:0;width:100%;height:100%}#cameraVideo{object-fit:cover;background:#1a2240}#handCanvas,#fxCanvas{pointer-events:none}#gameLayer{z-index:4}.camera-off #cameraVideo{opacity:0}.camera-off .camera-stage{background:linear-gradient(145deg,#76d7ff,#ffccdf 52%,#ffefae)}

#magicCursor{position:absolute;z-index:20;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle,#fff 0 20%,#fff05f 22% 45%,var(--a) 48%);box-shadow:0 0 18px 8px rgba(255,245,100,.8);pointer-events:none;transition:width .12s,height .12s,margin .12s;display:none}#magicCursor.pinch{width:46px;height:46px;margin:-23px 0 0 -23px;background:radial-gradient(circle,#fff 0 20%,#7fffe3 22% 45%,var(--b) 48%)}.gesture-badge{position:absolute;z-index:15;left:12px;bottom:12px;background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 3px var(--a);padding:8px 12px;font-weight:900}.feedback{position:absolute;z-index:30;left:50%;top:48%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(2rem,6vw,5rem);color:white;text-align:center;text-shadow:0 4px 0 var(--a),0 8px 22px rgba(0,0,0,.28);pointer-events:none;animation:feedback 1s both}@keyframes feedback{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.13)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.drag-item{position:absolute;width:150px;min-height:135px;z-index:9}.dragging{filter:drop-shadow(0 0 18px #fff56e);transform:scale(1.08)}.dropzones{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.dropzone{min-height:190px;border:5px dashed #fff;border-radius:26px;background:rgba(255,255,255,.48);box-shadow:0 0 0 5px color-mix(in srgb,var(--b) 55%,white);display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:clamp(1.2rem,2.5vw,1.7rem);font-weight:900;text-align:center}.dropzone.hot{background:rgba(255,244,118,.76);transform:scale(1.03)}.token-bank,.sentence-slot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%;min-height:90px;padding:12px;border-radius:22px;background:rgba(255,255,255,.55);border:4px dashed #fff}.sentence-slot{margin-bottom:20px;background:rgba(255,255,255,.88);border-style:solid}.word-token{padding:11px 17px;border:4px solid #fff;border-radius:18px;background:linear-gradient(#fff,#e9dcff);box-shadow:0 0 0 3px var(--a),0 7px 0 color-mix(in srgb,var(--a) 50%,#5b347d);font-weight:900;font-size:clamp(1rem,2.4vw,1.5rem);cursor:pointer}.word-token.used{opacity:.35;pointer-events:none}
.catcher{position:absolute;bottom:4%;width:150px;height:70px;margin-left:-75px;border-radius:20px 20px 45px 45px;background:linear-gradient(#fff,var(--a));border:5px solid white;box-shadow:0 0 0 5px var(--b),0 9px 18px rgba(0,0,0,.24);font-size:2.5rem;text-align:center;line-height:60px}.fall-item{position:absolute;width:105px;height:105px;border-radius:25px;border:4px solid #fff;background:rgba(255,255,255,.92);box-shadow:0 0 0 4px var(--a),0 8px 16px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;text-align:center}.fall-item span{font-size:2.5rem}.battle-wrap{display:grid;grid-template-columns:1fr minmax(280px,1.3fr) 1fr;gap:18px;width:100%;align-items:center}.fighter{font-size:clamp(5rem,12vw,10rem);text-align:center;filter:drop-shadow(0 14px 12px rgba(0,0,0,.2))}.hp{height:22px;border:4px solid white;border-radius:99px;background:#6b426b;overflow:hidden}.hp>i{display:block;height:100%;background:linear-gradient(90deg,#62e978,#fff475);width:100%;transition:.4s}.dialogue{width:min(900px,100%);display:grid;gap:15px}.speech{background:rgba(255,255,255,.94);border:5px solid #fff;border-radius:30px;box-shadow:0 0 0 5px var(--a),0 12px 24px rgba(0,0,0,.18);padding:20px;font-size:clamp(1.3rem,3vw,2rem);font-weight:900;text-align:center}.voice-meter{height:28px;width:min(620px,90%);border:4px solid #fff;border-radius:99px;background:#ddd;overflow:hidden;box-shadow:0 0 0 4px var(--a)}.voice-meter i{height:100%;display:block;width:10%;background:linear-gradient(90deg,var(--b),#fff36d,var(--a));transition:.25s}
.modal{position:fixed;z-index:80;inset:0;background:rgba(22,16,49,.72);display:flex;align-items:center;justify-content:center;padding:18px}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:linear-gradient(#fff,#fff1fb);border:5px solid white;border-radius:30px;box-shadow:0 0 0 6px var(--a),0 20px 50px rgba(0,0,0,.35);padding:22px;text-align:center;animation:pop .3s cubic-bezier(.2,1.35,.45,1)}.toast{position:fixed;z-index:99;left:50%;bottom:calc(var(--safeB) + 14px);transform:translateX(-50%);background:#332656;color:#fff;border:3px solid #fff;border-radius:99px;padding:10px 18px;font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.28);animation:toast 2.2s both}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,20px)}15%,80%{opacity:1;transform:translate(-50%,0)}}
.confetti{position:absolute;z-index:25;pointer-events:none;font-size:24px;animation:confetti 1.2s ease-out forwards}@keyframes confetti{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}.cal-grid{position:absolute;inset:18% 5% 8%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:15px}.cal-target{border:5px dashed white;border-radius:26px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:900}.cal-target.done{background:rgba(129,255,151,.78);border-style:solid}.rotate-note{display:none}@media(max-width:760px){.cover-grid{grid-template-columns:1fr}.cover-grid>.panel{display:none}.hero{min-height:280px}.hud{grid-template-columns:1fr auto}.target-panel{grid-row:2;grid-column:1/-1;max-width:94vw}.game-area{top:29%}.battle-wrap{grid-template-columns:1fr}.fighter{display:none}.screen-card{border-radius:24px}.game-option{min-height:120px}.option-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px) and (orientation:portrait){.rotate-note{display:block;position:fixed;z-index:100;right:8px;bottom:8px;background:#fff;border:3px solid var(--a);border-radius:14px;padding:5px 9px;font-size:.78rem;pointer-events:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

function renderRewards(s){const badges=[['First Star',state.stars>=1,'🌟'],['Home Helper',state.stars>=20,'🏠'],['Combo Cat',state.lastReport?.bestCombo>=5,'🐱'],['Word Wizard',state.stars>=60,'🪄']];s.innerHTML=shell('รางวัล / Rewards',`<div class="ribbon">⭐ Total Stars: ${state.stars}</div><div class="card-grid">${badges.map(b=>`<div class="choice-card" style="filter:${b[1]?'none':'grayscale(1) opacity(.5)'}"><div class="big">${b[2]}</div><b>${b[0]}</b><p>${b[1]?'UNLOCKED!':'Keep playing!'}</p></div>`).join('')}</div>`)}

function applyVideoMirror(){const should=state.settings.mirrorCamera&&state.settings.facing==='user';$('#cameraVideo').style.transform=should?'scaleX(-1)':'none';$('#cameraVideo').style.transformOrigin='center center'}
async function startCamera(){stopCamera();const v=$('#cameraVideo');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.settings.facing},width:{ideal:1280},height:{ideal:720}},audio:false});state.hand.stream=stream;const track=stream.getVideoTracks()[0];state.game.currentDeviceId=track?.getSettings?.().deviceId||state.settings.facing;const prof=state.settings.calibrationProfiles?.[state.game.currentDeviceId];if(prof&&typeof prof.mirror==='boolean')state.settings.mirrorCamera=prof.mirror;v.srcObject=stream;await v.play();$('#playShell').classList.remove('camera-off');applyVideoMirror();await initHands();return true}catch(e){console.warn(e);state.control='pointer';$('#playShell').classList.add('camera-off');showToast('เปิดกล้องไม่ได้ — เปลี่ยนเป็น Mouse / Touch');return false}}
function stopCamera(){if(state.hand.stream){state.hand.stream.getTracks().forEach(t=>t.stop());state.hand.stream=null}const v=$('#cameraVideo');if(v)v.srcObject=null}
async function initHands(){if(!window.Hands){showToast('MediaPipe CDN ไม่พร้อม — ใช้ Mouse / Touch');state.control='pointer';return false}if(!state.hand.hands){state.hand.hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});state.hand.hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.55,minTrackingConfidence:.55});state.hand.hands.onResults(onHands)}startHandProcessing();return true}
function startHandProcessing(){if(state.hand.running||state.control!=='camera'||!state.hand.hands)return;state.hand.running=true;const loop=async()=>{if(!state.hand.running)return;const v=$('#cameraVideo');if(v.readyState>=2&&['CALIBRATION','PLAYING','COUNTDOWN'].includes(state.screen)){try{await state.hand.hands.send({image:v})}catch(e){}}state.hand.raf=requestAnimationFrame(loop)};loop()}
function stopHandProcessing(){state.hand.running=false;cancelAnimationFrame(state.hand.raf);clearHandCanvas()}
function clearHandCanvas(){const c=$('#handCanvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function resizeCanvases(){const st=$('#cameraStage'),r=st.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);for(const id of ['handCanvas','fxCanvas']){const c=$('#'+id);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);c.style.width=r.width+'px';c.style.height=r.height+'px';const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0)}}
function mapLandmark(lm){const st=$('#cameraStage'),v=$('#cameraVideo'),r=st.getBoundingClientRect();const vw=v.videoWidth||r.width,vh=v.videoHeight||r.height;const scale=Math.max(r.width/vw,r.height/vh),rw=vw*scale,rh=vh*scale,ox=(r.width-rw)/2,oy=(r.height-rh)/2;const mirror=state.settings.mirrorCamera&&state.settings.facing==='user';const nx=mirror?1-lm.x:lm.x;return{x:ox+nx*rw,y:oy+lm.y*rh}}
function onHands(res){resizeCanvases();const c=$('#handCanvas'),ctx=c.getContext('2d'),r=$('#cameraStage').getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!res.multiHandLandmarks?.length){state.hand.detected=false;$('#magicCursor').style.display='none';$('#gestureBadge').textContent='✋ Hand not detected';return}state.hand.detected=true;const lm=res.multiHandLandmarks[0],handed=res.multiHandedness?.[0]?.label||'';const p=mapLandmark(lm[8]),thumb=mapLandmark(lm[4]);const alpha=.18+state.settings.sensitivity*.45;state.hand.x+=(p.x-state.hand.x)*alpha;state.hand.y+=(p.y-state.hand.y)*alpha;const pinch=Math.hypot(p.x-thumb.x,p.y-thumb.y)<Math.min(r.width,r.height)*.065;const ext=[8,12,16,20].filter((tip,i)=>lm[tip].y<lm[[6,10,14,18][i]].y).length;state.hand.open=ext>=4;state.hand.fist=ext===0;state.hand.handed=handed;drawLandmarks(ctx,lm);const cur=$('#magicCursor');cur.style.display='block';cur.style.left=state.hand.x+'px';cur.style.top=state.hand.y+'px';cur.classList.toggle('pinch',pinch);$('#gestureBadge').textContent=`✋ ${handed} • ${pinch?'Pinch':state.hand.open?'Open Palm':state.hand.fist?'Fist':'Point'}`;handleCursor(state.hand.x,state.hand.y,pinch,state.hand.prevPinch,'hand');state.hand.prevPinch=pinch}
function drawLandmarks(ctx,lm){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='rgba(103,255,237,.9)';ctx.lineWidth=4;const chains=[[0,1,2,3,4],[0,5,6,7,8],[5,9,10,11,12],[9,13,14,15,16],[13,17,18,19,20],[0,17]];for(const chain of chains){ctx.beginPath();chain.forEach((i,j)=>{const p=mapLandmark(lm[i]);j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke()}for(let i=0;i<lm.length;i++){const p=mapLandmark(lm[i]);ctx.beginPath();ctx.fillStyle=i===8?'#fff45f':'#ff62b2';ctx.arc(p.x,p.y,i===8?7:4,0,Math.PI*2);ctx.fill()}}
function elementAtStage(x,y,selector='[data-select]'){const r=$('#cameraStage').getBoundingClientRect();return document.elementsFromPoint(r.left+x,r.top+y).find(e=>e.matches?.(selector))||null}
function handleCursor(x,y,down,prevDown,source){if(state.screen==='CALIBRATION'){handleCalibration(x,y,down,prevDown);return}if(state.screen!=='PLAYING'||state.locked)return;if(['catch','listenCatch'].includes(CONFIG.type)){state.game.catcherX=x;return}const el=elementAtStage(x,y,'[data-select],[data-drag],[data-drop]');$$('.hovered').forEach(e=>e.classList.remove('hovered'));if(el)el.classList.add('hovered');if(down&&!prevDown){if(el?.dataset.drag){state.hand.dragEl=el;const er=el.getBoundingClientRect(),sr=$('#cameraStage').getBoundingClientRect();state.hand.dragOffset={x:x-(er.left-sr.left),y:y-(er.top-sr.top)};el.classList.add('dragging')}else if(el?.dataset.select){activateSelect(el)}}if(state.hand.dragEl&&down){const d=state.hand.dragEl;d.style.position='absolute';d.style.left=(x-state.hand.dragOffset.x)+'px';d.style.top=(y-state.hand.dragOffset.y)+'px'}if(!down&&prevDown&&state.hand.dragEl){const d=state.hand.dragEl;d.classList.remove('dragging');const drop=elementAtStage(x,y,'[data-drop]');finishDrop(d,drop);state.hand.dragEl=null}if(source==='hand'&&!down&&el?.dataset.select){if(state.hand.dwellEl!==el){state.hand.dwellEl=el;state.hand.dwellStart=performance.now()}else if(performance.now()-state.hand.dwellStart>650){activateSelect(el);state.hand.dwellEl=null}}else if(!el){state.hand.dwellEl=null}}

function prepareRound(){let pool=[...state.content];if(['voice','roleplay'].includes(CONFIG.type))pool=pool.filter(x=>['routine','chore'].includes(x.category));if(CONFIG.type==='drag')pool=pool.filter(x=>['bedroom','bathroom','kitchen','living room','outside'].includes(x.room));if(CONFIG.type==='quiz')pool=pool.filter(x=>['object','routine','chore'].includes(x.category));state.round=shuffle(pool).slice(0,Math.min(Number(state.settings.roundSize),pool.length));state.q=0;state.score=0;state.combo=0;state.bestCombo=0;state.hearts=3;state.mistakes=[];state.locked=false;state.game.battleHP=100;state.game.bossHP=100;state.game.resultCommitted=false}

function promptFor(item){if(CONFIG.type==='quiz')return `Where is the ${item.word}?`;if(CONFIG.type==='roleplay')return rolePrompt(item).prompt;if(CONFIG.type==='sentence')return 'Build the sentence';if(CONFIG.type==='voice')return state.mode.includes('Sentence')?item.sentence:item.word;if(CONFIG.type==='drag')return `Put “${item.word}” in the correct room.`;if(CONFIG.type==='sort')return `Sort “${item.word}” into the correct category.`;if(['catch','listenCatch'].includes(CONFIG.type))return state.mode.includes('Audio')||CONFIG.type==='listenCatch'?'Listen and catch!':`Catch: ${item.word}`;return `${CONFIG.type==='choice'?'Choose':'Tap'}: ${item.word}`}

function selectToken(el){if(el.classList.contains('used'))return;el.classList.add('used');state.game.sentenceBuilt.push(el.textContent.trim());$('#sentenceSlot').innerHTML=state.game.sentenceBuilt.map(w=>`<span class="word-token">${esc(w)}</span>`).join(' ')}
function checkSentence(){const item=state.round[state.q],want=item.sentence.replace(/[.!?]/g,'').toLowerCase(),got=state.game.sentenceBuilt.join(' ').toLowerCase();answerFeedback(got===want,item,got||'ยังไม่ได้เรียง')}
function undoSentence(){state.game.sentenceBuilt.pop();$$('.word-token.used').forEach(e=>e.classList.remove('used'));const built=[...state.game.sentenceBuilt];$$('[data-kind=token]').forEach(e=>{const ix=built.indexOf(e.textContent.trim());if(ix>=0){e.classList.add('used');built.splice(ix,1)}});$('#sentenceSlot').innerHTML=state.game.sentenceBuilt.length?state.game.sentenceBuilt.map(w=>`<span class="word-token">${esc(w)}</span>`).join(' '):'<span>แตะคำตามลำดับ / Tap words in order</span>'}
function correctValue(item){if(CONFIG.type==='quiz')return item.room==='house'?'living room':item.room;if(CONFIG.type==='roleplay')return state.game.roleCorrect;return item.word}
function selectAnswer(value){const item=state.round[state.q];answerFeedback(value===correctValue(item),item,value)}
function answerFeedback(ok,item,chosen){if(state.locked)return;state.locked=true;if(ok){state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo);state.score+=100+state.combo*10;AudioFX.correct();burst(true);feedback(state.settings.fever&&state.combo===10?'🌈 SUPER CHIBI FEVER! 🌈':'✨ CORRECT! ✨');if(state.settings.fever&&state.combo===10)state.score+=500;if(CONFIG.type==='quiz'){state.game.bossHP=Math.max(0,state.game.bossHP-20);const b=$('#bossHP');if(b)b.style.width=state.game.bossHP+'%'}}else{state.combo=0;state.hearts=Math.max(0,state.hearts-1);state.score=Math.max(0,state.score-20);state.mistakes.push({correct:item,chosen});AudioFX.wrong();burst(false);feedback('ลองอีกครั้งนะ! 💖');if(CONFIG.type==='quiz'){state.game.battleHP=Math.max(0,state.game.battleHP-20);const p=$('#playerHP');if(p)p.style.width=state.game.battleHP+'%'}}updateHUD();speak(item.word);setTimeout(()=>{state.q++;showQuestion()},ok?1200:1450)}
function updateHUD(){const set=(id,v)=>{const e=$(id);if(e)e.textContent=v};set('#scoreVal',state.score);set('#heartVal',state.hearts);set('#comboVal',state.combo)}
function feedback(t){const d=document.createElement('div');d.className='feedback';d.textContent=t;$('#gameLayer').append(d);setTimeout(()=>d.remove(),1100)}
function burst(ok){if(state.settings.reduceEffects)return;const box=$('#gameLayer'),n=state.settings.quality==='Low'?8:state.settings.quality==='Medium'?14:22;for(let i=0;i<n;i++){const d=document.createElement('span');d.className='confetti';d.textContent=ok?['★','✦','♡','🌈'][i%4]:'?';d.style.left='50%';d.style.top='50%';d.style.setProperty('--dx',(Math.random()*500-250)+'px');d.style.setProperty('--dy',(Math.random()*400-260)+'px');box.append(d);setTimeout(()=>d.remove(),1300)}}
function spawnCatch(){const item=state.round[state.q],area=$('#catchArea');if(!area)return;const correct=Math.random()<.42;const obj=correct?item:sampleOthers(item,1)[0];const el=document.createElement('div');el.className='fall-item';el.innerHTML=`<span>${obj.emoji}</span><small>${state.mode.includes('Audio')||CONFIG.type==='listenCatch'?'?':esc(obj.word)}</small>`;area.append(el);const w=area.clientWidth-110,x=Math.random()*Math.max(1,w);const rec={el,x,y:-110,speed:70+Math.random()*55,word:obj.word,correct};el.style.left=x+'px';el.style.top='-110px';state.game.catchItems.push(rec)}
function tickCatch(dt){const area=$('#catchArea'),catcher=$('#catcher');if(!area||!catcher)return;const aw=area.clientWidth;state.game.catcherX=Math.max(75,Math.min(aw-75,state.game.catcherX));catcher.style.left=state.game.catcherX+'px';state.game.catchLast+=dt;if(state.game.catchLast>.75){state.game.catchLast=0;spawnCatch()}for(const o of [...state.game.catchItems]){o.y+=o.speed*dt;o.el.style.transform=`translateY(${o.y}px) rotate(${o.y*.18}deg)`;if(o.y>area.clientHeight-150){if(Math.abs((o.x+52)-state.game.catcherX)<105){o.el.remove();state.game.catchItems.splice(state.game.catchItems.indexOf(o),1);const item=state.round[state.q];if(o.correct){answerFeedback(true,item,o.word);return}else{state.hearts=Math.max(0,state.hearts-1);state.combo=0;AudioFX.wrong();feedback('ของนี้ยังไม่ใช่ 💡');updateHUD()}}else if(o.y>area.clientHeight+10){o.el.remove();state.game.catchItems.splice(state.game.catchItems.indexOf(o),1)}}}}
let lastFrame=performance.now();function startGameLoop(){lastFrame=performance.now();state.game.timer=requestAnimationFrame(loopGame)}function stopGameLoop(){cancelAnimationFrame(state.game.timer)}function loopGame(now){if(state.screen!=='PLAYING')return;const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;if(!state.locked){state.time-=dt;const t=$('#timeVal');if(t)t.textContent=Math.max(0,Math.ceil(state.time));if(['catch','listenCatch'].includes(CONFIG.type))tickCatch(dt);if(state.time<=0){answerFeedback(false,state.round[state.q],'หมดเวลา')}}state.game.timer=requestAnimationFrame(loopGame)}
function finishRound(){stopGameLoop();stopHandProcessing();stopCamera();go('RESULT')}
function replay(){const item=state.round[state.q];if(!item)return;speak(CONFIG.type==='voice'&&state.mode.includes('Sentence')?item.sentence:item.word,true)}
function hint(){const item=state.round[state.q];if(!item||!state.settings.hints)return showToast('ครูปิด Hint ไว้');if(CONFIG.type==='sentence'){const next=state.game.sentenceWords[state.game.sentenceBuilt.length];const el=$$('[data-kind=token]').find(e=>!e.classList.contains('used')&&e.textContent.trim()===next);if(el){el.style.boxShadow='0 0 0 6px #fff36b,0 0 25px #fff'}}else if(CONFIG.type==='drag'){const z=$(`[data-drop="${item.room}"]`);if(z)z.classList.add('hot')}else{const val=correctValue(item),el=$(`[data-select="${CSS.escape(val)}"]`);if(el)el.style.boxShadow='0 0 0 7px #fff36b,0 0 28px #fff'}speak(item.word)}
function pause(){state.screen='PAUSED';stopGameLoop();stopHandProcessing();const m=$('#modal');m.classList.remove('hidden');m.innerHTML=`<div class="modal-card"><h2 class="title">⏸️ PAUSED</h2><div class="actions"><button class="btn start" data-action="resume">▶ Resume</button><button class="btn" data-action="goHome">🏠 Home</button></div></div>`}
function resume(){state.screen='PLAYING';$('#modal').classList.add('hidden');startGameLoop();if(state.control==='camera')startHandProcessing()}
function goHome(){stopCamera();$('#modal').classList.add('hidden');go('COVER')}
async function startCalibration(){state.screen='CALIBRATION';$('#screen').classList.add('hidden');$('#playShell').classList.remove('hidden');resizeCanvases();await startCamera();const layer=$('#gameLayer');state.game.calStep=0;layer.innerHTML=hud('Hand Calibration','ขยับมือให้เคอร์เซอร์ตรงกับมือจริง')+`<div class="cal-grid"><div class="cal-target" data-cal="left">← Move Left</div><div class="cal-target" data-cal="right">Move Right →</div><div class="cal-target" data-cal="tapL">☝️ Touch Left</div><div class="cal-target" data-cal="tapR">Touch Right ☝️</div><div class="cal-target" data-cal="pinch">🤏 Pinch at Center</div><div class="cal-target" data-cal="drag">↔ Pinch-Drag Left → Right</div></div><div class="actions" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:30"><button class="btn small" data-action="fixMirror">↔ Fix Mirror</button><button class="btn small alt" data-action="skipCalibration">ผ่าน / Continue</button></div>`;startHandProcessing()}
function saveCalibration(){const id=state.game.currentDeviceId||state.settings.facing;state.settings.calibrationProfiles=state.settings.calibrationProfiles||{};state.settings.calibrationProfiles[id]={mirror:state.settings.mirrorCamera,passedAt:new Date().toISOString()};save()}function handleCalibration(x,y,down,prev){const r=$('#cameraStage').getBoundingClientRect();let key=null;if(y<r.height*.48)key=x<r.width/2?'left':'right';else if(y<r.height*.70)key=x<r.width/2?'tapL':'tapR';else if(y<r.height*.90&&down&&!prev)key='pinch';if(down&&x<r.width*.28)state.game.calDragStart=x;if(down&&state.game.calDragStart!=null&&x>r.width*.72)key='drag';if(!down)state.game.calDragStart=null;if(key){const el=$(`[data-cal="${key}"]`);if(el)el.classList.add('done')}if($$('.cal-target.done').length>=6)setTimeout(()=>{saveCalibration();stopHandProcessing();go('PREVIEW')},500)}
async function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('เบราว์เซอร์นี้ไม่รองรับ Speech Recognition — ใช้ปุ่ม “พูดแล้ว”');return}const item=state.round[state.q],target=(state.mode.includes('Sentence')?item.sentence:item.word).toLowerCase();const rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;state.game.voiceRecognition=rec;$('#voiceText').textContent='กำลังฟัง... / Listening...';rec.onresult=e=>{let txt='';for(const r of e.results)txt+=r[0].transcript;$('#voiceText').textContent=txt;const bar=$('#voiceBar');if(bar)bar.style.width=Math.min(100,20+txt.length*5)+'%';if(e.results[e.results.length-1].isFinal){const norm=s=>s.toLowerCase().replace(/[^a-z ]/g,'').trim();const ok=norm(txt).includes(norm(target))||norm(target).includes(norm(txt));answerFeedback(ok,item,txt)}};rec.onerror=e=>{$('#voiceText').textContent='ไมโครโฟนไม่พร้อม: '+e.error};rec.start()}
function bindPointer(){const st=$('#cameraStage');st.addEventListener('pointermove',e=>{if(state.control!=='pointer'||!['PLAYING','CALIBRATION'].includes(state.screen))return;const r=st.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;state.hand.x=x;state.hand.y=y;const c=$('#magicCursor');c.style.display='block';c.style.left=x+'px';c.style.top=y+'px';handleCursor(x,y,(e.buttons&1)>0,state.hand.prevPinch,'pointer');state.hand.prevPinch=(e.buttons&1)>0});st.addEventListener('pointerdown',e=>{if(state.control!=='pointer')return;st.setPointerCapture?.(e.pointerId);const r=st.getBoundingClientRect();state.hand.prevPinch=false;handleCursor(e.clientX-r.left,e.clientY-r.top,true,false,'pointer');state.hand.prevPinch=true});st.addEventListener('pointerup',e=>{if(state.control!=='pointer')return;const r=st.getBoundingClientRect();handleCursor(e.clientX-r.left,e.clientY-r.top,false,true,'pointer');state.hand.prevPinch=false});}
bindPointer();new ResizeObserver(()=>resizeCanvases()).observe($('#cameraStage'));window.addEventListener('orientationchange',()=>setTimeout(resizeCanvases,250));
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;initAudio();AudioFX.click();const a=b.dataset.action;if(a==='go')go(b.dataset.to);else if(a==='mode'){state.mode=b.dataset.value;render()}else if(a==='difficulty'){state.difficulty=b.dataset.value;render()}else if(a==='control'){state.control=b.dataset.value;render()}else if(a==='prepareControl'){state.control==='camera'?startCalibration():go('PREVIEW')}else if(a==='startRound')beginCountdown();else if(a==='speak')speak(b.dataset.text);else if(a==='saveSettings'){syncSettings();save();AudioFX.apply();showToast('บันทึกแล้ว / Saved')}else if(a==='fullscreen'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}else if(a==='addContent'){syncTeacherRows();state.content.push({word:'new word',th:'คำใหม่',emoji:'⭐',category:'object',room:'living room',sentence:'This is a new word.'});renderTeacher($('#screen'))}else if(a==='deleteContent'){syncTeacherRows();state.content.splice(Number(b.dataset.index),1);renderTeacher($('#screen'))}else if(a==='saveContent'){syncTeacherRows();save();showToast('บันทึกรายการแล้ว')}else if(a==='exportData'){syncTeacherRows();$('#jsonData').value=JSON.stringify({game:CONFIG.title,settings:state.settings,content:state.content},null,2)}else if(a==='importData'){try{const d=JSON.parse($('#jsonData').value);if(d.settings)Object.assign(state.settings,d.settings);if(Array.isArray(d.content))state.content=d.content;save();renderTeacher($('#screen'));showToast('Import สำเร็จ')}catch(err){showToast('JSON ไม่ถูกต้อง')}}else if(a==='resetData'){localStorage.removeItem(KEY);location.reload()}else if(a==='replay')replay();else if(a==='hint')hint();else if(a==='pause')pause();else if(a==='resume')resume();else if(a==='goHome')goHome();else if(a==='sentenceUndo')undoSentence();else if(a==='sentenceCheck')checkSentence();else if(a==='voiceStart')startVoice();else if(a==='voiceSelf')answerFeedback(true,state.round[state.q],'self-check');else if(a==='switchCamera'){state.settings.facing=state.settings.facing==='user'?'environment':'user';state.settings.mirrorCamera=state.settings.facing==='user';await startCamera();showToast(state.settings.facing==='user'?'Front Camera':'Rear Camera')}else if(a==='fixMirror'){state.settings.mirrorCamera=!state.settings.mirrorCamera;applyVideoMirror();showToast(state.settings.mirrorCamera?'Mirror ON':'Mirror OFF')}else if(a==='skipCalibration'){saveCalibration();stopHandProcessing();go('PREVIEW')}});
document.addEventListener('click',e=>{const sel=e.target.closest('[data-select]');if(sel&&state.screen==='PLAYING')activateSelect(sel)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-teach-tab]');if(!t)return;$$('[data-teach-tab]').forEach(x=>x.classList.toggle('active',x===t));['content','round','report','data'].forEach(x=>$('#teacher'+x[0].toUpperCase()+x.slice(1))?.classList.toggle('hidden',x!==t.dataset.teachTab))});
document.addEventListener('change',e=>{if(e.target.dataset.setting){const k=e.target.dataset.setting;state.settings[k]=e.target.type==='checkbox'?e.target.checked:e.target.type==='number'||e.target.type==='range'?Number(e.target.value):e.target.value;AudioFX.apply();if(k==='facing'){state.settings.mirrorCamera=state.settings.facing==='user'}save()}});
function syncSettings(){$$('[data-setting]').forEach(e=>{state.settings[e.dataset.setting]=e.type==='checkbox'?e.checked:e.type==='number'||e.type==='range'?Number(e.value):e.value})}
function syncTeacherRows(){$$('tr[data-row]').forEach(tr=>{const i=Number(tr.dataset.row),x=state.content[i];if(!x)return;$$('[data-field]',tr).forEach(inp=>x[inp.dataset.field]=inp.value);x.category=x.category||'object';x.sentence=x.sentence||`This is ${x.word}.`})}
window.addEventListener('beforeunload',()=>{save();stopCamera();clearInterval(AudioFX.loop)});render();
</script>
